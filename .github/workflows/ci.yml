name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Run tests
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Check generated results are fresh
        run: |
          julia --project=. examples/make_results.jl
          git diff --exit-code -- examples/results.json test/fixtures/valuation_parity.json
      - name: Python parity check
        run: python3 test/check_parity.py
